<mat-drawer-container [hasBackdrop]="false">

  <mat-drawer #drawer
              [class.resizing]="isResizing()"
              [opened]="opened()"
              [position]="position()"
              [style.width.px]="drawerWidth()"
              class="resizable-drawer"
              mode="push">

    <div class="drawer-inner-content">
      <ng-content select="app-drawer" />
    </div>
    <!-- Tirador invisible/visible per arrossegar la vora -->
    <div (mousedown)="startResizing($event)" class="resize-handle"></div>
  </mat-drawer>

  <mat-drawer-content
    [class.resizing]="isResizing()"
    [style.margin-left.px]="drawer.opened ? drawerWidth() : 0">
    <div class="content-body">
      <ng-content />
    </div>
  </mat-drawer-content>

</mat-drawer-container>
