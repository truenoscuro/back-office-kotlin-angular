<mat-toolbar>
  <button (click)="drawer.toggle()"
          class="example-icon"
          matIconButton>
    <mat-icon>menu</mat-icon>
  </button>
  <span>My App</span>
  <span class="spacer"></span>
  <button matIconButton>
    <mat-icon>favorite</mat-icon>
  </button>
  <button matIconButton>
    <mat-icon>share</mat-icon>
  </button>
</mat-toolbar>

<app-drawer-container #drawer
                      (drawerWidthChange)="onChangeCollapsed($event)"
                      opened="true">
  <app-drawer>
    <!-- Contingut aquí -->
    <app-menu [collapsed]="isCollapsed()" />
  </app-drawer>
  <div class="content-body">
    <ng-content />
  </div>

</app-drawer-container>
